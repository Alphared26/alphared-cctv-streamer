async function loadGlobalSettings() {
  const st = $('#saveStatus');
  try {
    const s = await api.get(API + '/settings');
    state.settings = s;
    const v = (id, val) => { const el = $('#' + id); if (el) el.value = val; };
    v('set-client-id', s.youtube_client_id || '');
    v('set-playlist', s.youtube_playlist_id || '');
    v('set-live-duration', s.live_duration_minutes || 715);
    v('set-segment', s.record_segment_seconds || 3600);
    v('set-guard', s.disk_guard_min_gb || 10);
    v('set-retention', s.disk_retention_days || 7);
    const sec = $('#set-client-secret');
    if (sec) {
      sec.value = '';
      sec.placeholder = s.youtube_client_secret ? '••••••••' : 'Belum diisi';
    }
    const help = $('#secretHelp');
    if (help) help.textContent = s.youtube_client_secret
      ? 'Tersimpan di server. Isi hanya bila ingin mengganti.'
      : 'Belum ada secret tersimpan.';
    renderOauthStatus(!!s.youtube_refresh_token);

function renderOauthStatus(connected) {

  if (!txt) return;
  txt.textContent = connected ? 'Terhubung' : 'Belum terhubung';
  if (ico) ico.firstElementChild.setAttribute('href', connected ? '#i-check' : '#i-lock');

function checkDurationWarn() {
  const el = $('#set-live-duration');

  if (!el || !help) return;
  const n = parseInt(el.value, 10) || 0;
  if (n > 715) {
    help.textContent = 'Di atas 715 menit. YouTube memotong arsip pada 12 jam, sesi lebih panjang berisiko terpotong.';
    help.className = 'help help-err';
  } else {
    help.textContent = '715 menit = 11 jam 55 menit.';
    help.className = 'help';
  }
}
async function saveGlobalSettings(e) {
  if (e) e.preventDefault();
  const st = $('#saveStatus');
  const btn = $('#saveBtn');
  const secret = $('#set-client-secret').value.trim();
  const payload = {
    youtube_client_id: $('#set-client-id').value.trim(),
    youtube_playlist_id: $('#set-playlist').value.trim(),
    live_duration_minutes: parseInt($('#set-live-duration').value, 10) || 715,
    record_segment_seconds: parseInt($('#set-segment').value, 10) || 3600,
    disk_guard_min_gb: parseInt($('#set-guard').value, 10) || 10,
    disk_retention_days: parseInt($('#set-retention').value, 10) || 7
  };

  if (st) { st.textContent = 'Menyimpan'; st.className = 'st'; }
  busyBtn(btn, true);
  try {
    await api.put(API + '/settings', payload);
    if (st) { st.textContent = 'Pengaturan disimpan. Nilai baru berlaku pada proses berikutnya.'; st.className = 'st ok'; }

async function startYouTubeOAuth(btn) {
  const st = $('#saveStatus');
  const secret = $('#set-client-secret').value.trim();
  busyBtn(btn, true);
  try {
    const pre = {
      youtube_client_id: $('#set-client-id').value.trim(),
      youtube_playlist_id: $('#set-playlist').value.trim()
    };
    if (secret) pre.youtube_client_secret = secret;
    await api.put(API + '/settings', pre);
    const data = await api.post(API + '/settings/youtube-auth-url');
    if (!data || !data.url) throw new Error('URL otorisasi tidak tersedia');
    window.open(data.url, '_blank', 'noopener');
    if (st) { st.textContent = 'Tempel kode otorisasi dari Google di kolom bawah.'; st.className = 'st'; }
    const code = $('#oauth-code');

    toast('err', 'Otorisasi Google gagal', e.message);

    busyBtn(btn, false);

async function submitYouTubeOAuthCode(code, btn) {

    busyBtn(btn, false);

/* ── polling ─────────────────────────────────────────────────── */
function visible() { return document.visibilityState === 'visible'; }
function clockTick() {
  const d = new Date();
  const el = $('#clock');
  if (el) el.textContent = hhmmss(d);
  $$('[data-since]').forEach(node => {
    const since = Number(node.dataset.since);
    const v = upFrom(since);
    const txt = v || node.dataset.none || '—';
    if (node.textContent !== txt) node.textContent = txt;
  });
  if (state.quotaDeadline) {
    const left = quotaLeft();
    const node = $('#quotaLeft');
    if (node) node.textContent = left > 0 ? fmtUp(left) : 'menunggu';
    if (left === 0) state.quotaDeadline = 0;
  }
}
function dispatcher() {
  if (!visible()) return;
  state.tick++;
  clockTick();
  if (state.tick % 5 === 0) {
    fetchSystemStats();
    if (state.page === 'monitor') { loadCameras(true); refreshSnapshots(); }
  }
  if (state.tick % 15 === 0) {
    loadYouTubeStatus();
    if (state.page === 'monitor') loadStorage();
  }
  if (state.tick % 3 === 0 && state.page === 'log') refreshTabLogs();
  tickFsMeta();
}

/* ── actions table ───────────────────────────────────────────── */
const ACT = {
  add: () => resetForm(),
  reload: () => refreshAll(),
  refload: () => loadGuideContent(),
  recstart: (id, el) => startRecord(id, el),
  recstop: (id, el) => stopRecord(id, el),
  livestart: (id, el) => startStream(id, el),
  livestop: (id, el) => stopStream(id, el),
  menu: (id, el) => openMenu(el, [
    { act: 'playcam', id: id, icon: 'i-playback', label: 'Lihat rekaman' },
    { act: 'camlog', id: id, icon: 'i-logs', label: 'Buka log kamera' },
    { act: 'editcam', id: id, icon: 'i-settings', label: 'Ubah konfigurasi' },
    { act: 'copyrtsp', id: id, icon: 'i-copy', label: 'Salin URL RTSP' },
    { sep: true },
    { act: 'delcam', id: id, icon: 'i-trash', label: 'Hapus kamera', danger: true }
  ]),
  livetoggle: (id, el) => toggleLive(id, el),
  fullscreen: id => toggleFullscreen(id),
  playcam: id => goToPlayback(id),
  camlog: id => viewLogs(id),
  editcam: id => editCamera(id),
  copyrtsp: id => { const c = camById(id); copyText(c ? c.rtsp_url : '', 'URL RTSP disalin'); },
  delcam: id => deleteCamera(id),
  pbdate: d => selectPlaybackDate(d),
  pbload: () => onPlaybackCameraChange(),
  play: (url, el) => {
    const row = el.closest('.trow');
    const idx = row ? Number(row.dataset.row) : -1;
    const s = state.pb.segments[idx];
    if (s) playVideoSegment(s.url, s.filename, s.start_time, s.end_time, s.size_mb);
  },
  speed: v => setPlaybackSpeed(v),
  zip: (id, el) => batchDownloadZip(el),
  delseg: () => batchDeleteSegments(),
  chan: c => switchLogChannel(c),
  copylog: () => copyTabLogs(),
  reflog: () => refreshTabLogs(),
  oauth: (id, el) => startYouTubeOAuth(el),
  oauthcode: (id, el) => submitManualOAuthCode(el),
  sync: (id, el) => syncLiveToPlaylistManual(el)
};

document.addEventListener('click', e => {
  const nav = e.target.closest('.nav-item');
  if (nav) return;
  const menuBtn = e.target.closest('[data-menu]');
  if (menuBtn) {
    const fn = ACT[menuBtn.dataset.menu];
    const id = menuBtn.dataset.id;
    closeMenu();
    if (fn) fn(id, menuBtn);
    return;
  }
  if (!e.target.closest('#menu')) closeMenu();
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A') return;
  e.preventDefault();
  fn(el.dataset.id, el);
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-chg]');
  if (!el) return;
  const kind = el.dataset.chg;
  if (kind === 'pbcam') onPlaybackCameraChange();
  else if (kind === 'pball') toggleSelectAllSegments(el.checked);
  else if (kind === 'seg') toggleSegmentSelect(el.dataset.path, el.checked);
  else if (kind === 'logcam') onTabLogCamChange();
  else if (kind === 'autoscroll') { state.log.auto = el.checked; el.setAttribute('aria-checked', el.checked ? 'true' : 'false'); paintLog(); }
});

document.addEventListener('input', e => {
  const el = e.target.closest('[data-inp]');
  if (!el) return;
  if (el.dataset.inp === 'logfilter') { state.log.filter = el.value; paintLog(); }
  if (el.id === 'set-live-duration') checkDurationWarn();
});

document.addEventListener('error', e => {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.classList.contains('snap-img')) return;
  img.style.display = 'none';
  const media = img.parentElement;
  if (media && !media.querySelector('.media-err')) {
    const box = document.createElement('div');
    box.className = 'media-err';
    box.innerHTML = '<svg class="ico" style="width:20px;height:20px" aria-hidden="true"><use href="#i-alert"/></svg>' +
      '<span>Pratinjau tidak tersedia</span>';
    media.appendChild(box);
  }
}, true);

document.addEventListener('submit', e => {
  if (e.target.id === 'camera-form') handleFormSubmit(e);
  else if (e.target.id === 'settings-form') saveGlobalSettings(e);
});

document.addEventListener('keydown', e => {
  const scrim = !$('#scrimAsk').hidden ? $('#scrimAsk') : (!$('#scrimForm').hidden ? $('#scrimForm') : null);
  if (e.key === 'Escape') {
    if (!$('#menu').hidden) { closeMenu(); e.preventDefault(); return; }
    if (scrim) {
      e.preventDefault();
      if (scrim.id === 'scrimAsk') closeAsk(false);
      else closeFormModal();
      return;
    }
  }
  if (e.key === 'Tab' && scrim) {
    const f = $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', scrim)
      .filter(n => !n.disabled && n.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if (!$('#menu').hidden) {
    const items = $$('#menu button');
    const idx = items.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); items[(idx + 1) % items.length].focus(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); items[(idx - 1 + items.length) % items.length].focus(); }
  }
  const seg = e.target.closest('.seg');
  if (seg && (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'Home' || e.key === 'End')) {
    const tabs = $$('button:not(:disabled)', seg);
    const i = tabs.indexOf(e.target);
    if (i < 0) return;
    e.preventDefault();
    let n = i;
    if (e.key === 'ArrowRight') n = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') n = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') n = 0;
    else n = tabs.length - 1;
    tabs[n].focus();
    tabs[n].click();
  }
});

$('#askCancel').addEventListener('click', () => closeAsk(false));
$('#askOk').addEventListener('click', () => closeAsk(true));
$('#scrimAsk').addEventListener('click', e => { if (e.target.id === 'scrimAsk') closeAsk(false); });
$('#formCancel').addEventListener('click', closeFormModal);
$('#scrimForm').addEventListener('click', e => { if (e.target.id === 'scrimForm') closeFormModal(); });

// kontrol kolom grid
document.addEventListener('click', e => {
  const b = e.target.closest('#colsCtl button');
  if (!b) return;
  const v = parseInt(b.dataset.cols, 10) || 0;
  if (v > 0) localStorage.setItem(GRID_PREF_KEY, String(v));
  else localStorage.removeItem(GRID_PREF_KEY);
  applyGrid();
});

let gridResizeT = null;
window.addEventListener('resize', () => {
  clearTimeout(gridResizeT);
  gridResizeT = setTimeout(() => { if (gridPref() === 0) applyGrid(); }, 150);
});

function refreshAll() {
  loadCameras(true);
  fetchSystemStats();
  loadYouTubeStatus();
  loadStorage();
  if (state.page === 'log') refreshTabLogs();
  if (state.page === 'rekaman') onPlaybackCameraChange();
  toast('info', 'Memuat ulang data', null);
}

window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (visible()) dispatcher(); });

skeletonGrid();
loadYouTubeStatus();
loadCameras(true);
fetchSystemStats();
loadStorage();
route();
setInterval(dispatcher, 1000);
</script>
